                    <div>
                        <h3>Email</h3>
                        <p>efremesayas394@gmail.com</p>
                    </div>
                </div>
                <div class="info-card">
                    <i class="fas fa-map-marker-alt"></i>
                    <div>

                        <p>Wolaita Sodo, Ethiopia</p>
                    </div>
                </div>
                <!-- Social Accounts Linked -->

                    </div>

            <form action="https://api.web3forms.com/submit" method="POST" id="contact-form" class="contact-form">
                
                <!-- እዚህ ጋር YOUR_ACCESS_KEY_HERE የሚለውን አጥፍተው ከጂሜይልዎ ያገኙትን ትክክለኛ Key ያስገቡ -->
                <input type="hidden" name="access_key" value="71fb647e-dd7a-478f-93b8-2b694ef2d99e">

                <div class="input-group">
                    <input type="text" name="name" placeholder="Full Name" required>
                    <input type="email" name="email" placeholder="Your Email" required>
                </div>
                <input type="text" name="subject" placeholder="Subject" required>
                <textarea name="message" rows="6" placeholder="Your Message" required></textarea>
                <button type="submit" class="btn">Send Message</button>
                <div id="form-response"></div>
            </form>

        </div>
    </section>
